<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-emerald-400 via-emerald-500 to-teal-600 flex flex-col items-center py-14 px-4">

    <!-- Page Title -->
    <div class="text-center mb-5">
        <h1 class="text-5xl font-bold text-white drop-shadow-lg">
            Add Student
        </h1>
        <p class="text-emerald-100 mt-2 text-lg">
            Enter student details below
        </p>
    </div>

    <!-- Form Card -->
    <div class="w-full max-w-lg bg-white/90 backdrop-blur-lg rounded-2xl shadow-2xl p-10">

        <form class="space-y-6 text-slate-700">

            <!-- First Name -->
            <div>
                <label class="block mb-2 font-semibold text-slate-600">First Name</label>
                <input type="text" name="firstname"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>

            <!-- Surname -->
            <div>
                <label class="block mb-2 font-semibold text-slate-600">Surname</label>
                <input type="text" name="surname"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>

            <!-- Age -->
            <div>
                <label class="block mb-2 font-semibold text-slate-600">Age</label>
                <input type="number" name="age"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>

            <!-- School -->
            <div>
                <label class="block mb-2 font-semibold text-slate-600">School</label>
                <input type="text" name="school"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>

            <!-- Subject -->
            <div>
                <label class="block mb-2 font-semibold text-slate-600">Subject</label>
                <input type="text" name="subject"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>

            <!-- Buttons -->
            <div class="flex justify-between pt-4">
                <button type="reset"
                    class="bg-amber-400 hover:bg-amber-500 text-black font-semibold px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition-all duration-300">
                    Reset
                </button>

                <button type="submit"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition-all duration-300">
                    Submit
                </button>
            </div>

        </form>

    </div>

    <!-- Back Link -->
    <a href="StudentList.html"
       class="mt-10 text-white font-medium hover:underline hover:text-emerald-200 transition">
        ← View Student List
    </a>

</body>
</html>
