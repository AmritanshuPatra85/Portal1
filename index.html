<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-br from-emerald-400 via-emerald-500 to-teal-600 text-slate-800">

        <!-- Header -->
        <header class="text-center py-8">
            <h1 class="text-5xl font-bold text-white tracking-wide drop-shadow-lg">
                Learning Portal
            </h1>
            <p class="text-emerald-100 mt-2 text-lg">Manage students easily and efficiently</p>
        </header>

    <!-- Navigation -->
    <nav class="flex justify-center">
        <div class="bg-white/20 backdrop-blur-md rounded-xl shadow-lg px-10 py-4">
            <ul class="flex gap-10 text-lg font-semibold text-white">

                <li>
                    <a href="AddStudent.html"
                       class="px-6 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 transition-all duration-300 shadow-md hover:shadow-xl">
                       Add Students
                    </a>
                </li>

                <li>
                    <a href="StudentList.html"
                       class="px-6 py-2 rounded-lg bg-slate-800 hover:bg-slate-900 transition-all duration-300 shadow-md hover:shadow-xl">
                       Students List
                    </a>
                </li>

            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4">
        <div class="bg-white/80 backdrop-blur-lg rounded-2xl shadow-2xl px-12 py-10 text-center max-w-lg">
            <h2 class="text-2xl font-bold text-emerald-700 mb-3">
                Welcome 👋
            </h2>
            <p class="text-slate-600 text-lg">
                Select an option above to begin managing student records.
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-emerald-700 text-white text-center py-4 text-sm tracking-wide">
        © 2026 Learning Portal • Happy Learning 🚀
    </footer>

</body>
</html>
