<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-emerald-400 via-emerald-500 to-teal-600 flex justify-center py-12 px-4">

    <!-- Card Container -->
    <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-2xl w-full max-w-6xl p-10">

        <!-- Header Section -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-emerald-700">Student List</h1>
                <p class="text-slate-500 mt-1">Manage all registered students</p>
            </div>

            <a href="AddStudent.html"
               class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all duration-300">
               + Add Student
            </a>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse">

                <!-- Table Head -->
                <thead class="bg-slate-800 text-white text-sm uppercase tracking-wide">
                    <tr>
                        <th class="p-4">ID</th>
                        <th class="p-4">Full Name</th>
                        <th class="p-4">Email</th>
                        <th class="p-4">Date of Birth</th>
                        <th class="p-4">Course</th>
                        <th class="p-4 text-center">Actions</th>
                    </tr>
                </thead>

                <!-- Table Body -->
                <tbody class="text-slate-700 text-sm">

                    <tr class="border-b hover:bg-emerald-50 transition">
                        <td class="p-4 font-medium">1</td>
                        <td class="p-4">Amritanshu Patra</td>
                        <td class="p-4">amritanshupatra85@gmail.com</td>
                        <td class="p-4">08-05-2005</td>
                        <td class="p-4">
                            <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-semibold">
                                Mathematics
                            </span>
                        </td>
                        <td class="p-4 text-center space-x-3">
                            <button class="bg-blue-100 text-blue-600 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-blue-200 transition">
                                Edit
                            </button>
                            <button class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-red-200 transition">
                                Delete
                            </button>
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-emerald-50 transition">
                        <td class="p-4 font-medium">2</td>
                        <td class="p-4">Ronit Samanata</td>
                        <td class="p-4">ronit@gmail.com</td>
                        <td class="p-4">22-08-2005</td>
                        <td class="p-4">
                            <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold">
                                Physics
                            </span>
                        </td>
                        <td class="p-4 text-center space-x-3">
                            <button class="bg-blue-100 text-blue-600 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-blue-200 transition">
                                Edit
                            </button>
                            <button class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-red-200 transition">
                                Delete
                            </button>
                        </td>
                    </tr>

                    <tr class="hover:bg-emerald-50 transition">
                        <td class="p-4 font-medium">3</td>
                        <td class="p-4">Aninda Kundu</td>
                        <td class="p-4">Aninda@test.com</td>
                        <td class="p-4">03-11-2003</td>
                        <td class="p-4">
                            <span class="bg-pink-100 text-pink-700 px-3 py-1 rounded-full text-xs font-semibold">
                                Chemistry
                            </span>
                        </td>
                        <td class="p-4 text-center space-x-3">
                            <button class="bg-blue-100 text-blue-600 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-blue-200 transition">
                                Edit
                            </button>
                            <button class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-red-200 transition">
                                Delete
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>
        </div>

    </div>

</body>
</html>
